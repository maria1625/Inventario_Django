<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Eliminar producto</title></head>
  <body>
    <h1>Eliminar: {{ producto.nombre }}</h1>
    <p>¿Confirma eliminar este producto?</p>

      <a href="/productos/">Cancelar</a>
    </form>
  </body>
</html>
